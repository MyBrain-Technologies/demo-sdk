// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    apply from: 'versions.gradle'
    addRepos(repositories)

    dependencies {
        classpath deps.android_gradle_plugin
        classpath deps.kotlin.plugin
    }
}

allprojects {
    addRepos(repositories)
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def maven_user = properties.getProperty('maven_user')
    def maven_password = properties.getProperty('maven_password')
    repositories {
        google()
        jcenter()
        maven{
            url = "https://package.mybraintech.com/repository/maven-2-releases/"
            credentials {
                username $maven_user
                password $maven_password
            }
        }
        maven { url "https://jitpack.io" }
        maven{
            url 'https://package.mybraintech.com/repository/maven-public/'
            credentials {
                username "$maven_user"
                password "$maven_password"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}